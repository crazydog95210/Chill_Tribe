		<script>
			 // 刪除按鈕功能
			 function deleteProperty(button) {
        const confirmDelete = confirm("確定刪除?");
        if (confirmDelete) {
            const propertyElement = button.closest(".sides_list_property");
            propertyElement.remove();
        }
    }

  			document.addEventListener("DOMContentLoaded", function () {
   			 // 選取 Confirm Booking 按鈕
    		const confirmButton = document.querySelector(".btn-primary.rounded.full-width");
    		// 選取 ID 為 "done" 的區塊
    		const doneSection = document.getElementById("done");

    		// 添加點擊事件
    		confirmButton.addEventListener("click", function (event) {
     			 event.preventDefault(); // 防止默認跳轉行為
      
      			// 顯示 "done" 區塊
     			 if (doneSection) {
       			 doneSection.style.display = "block"; // 顯示區塊
      			}

      			// 滾動到 "done" 區塊
      		doneSection.scrollIntoView({ behavior: "smooth", block: "start" });
   		 		});
  			});
			//------------------------------
			  function goToPayment() {
				// 找到選中的 property
				const selectedProperty = document.querySelector('input[name="property"]:checked');
				if (!selectedProperty) {
					alert("請選擇一個項目!");
					return;
				}

				// 獲取該項目的相關內容
				const propertyContainer = selectedProperty.closest('.sides_list_property');
				const title = propertyContainer.querySelector('h4 a').textContent.trim();
				const location = propertyContainer.querySelector('.text-muted-2').textContent.trim();
				const price = propertyContainer.querySelector('.lists_property_price_value h4').textContent.trim();

				// 將資料組裝成對象
				const propertyData = {
					title: title,
					location: location,
					price: price
				};

				// 存到 localStorage（或可使用URL參數）
				localStorage.setItem('selectedProperty', JSON.stringify(propertyData));

				// 跳轉到目標網頁
				window.location.href = 'payment.html';
			}

		</script>
